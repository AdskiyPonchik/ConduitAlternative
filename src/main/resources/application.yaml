spring:
  application:
    name: conduit-backend
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  config:
    import: "optional:file:./.env[.properties]"

conduit:
  jwt:
    issuer: conduit-backend
    audience: conduit-api
    ttl-seconds: 900
    secret: ${CONDUIT_JWT_SECRET}