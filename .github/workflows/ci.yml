name: Verify application

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/cache@v4
        with:
          # setup-java caches ~/.m2/repository only; the wrapper downloads Maven itself into ~/.m2/wrapper.
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      - run: ./mvnw --batch-mode --no-transfer-progress verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-results
          path: target/surefire-reports/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm test:unit
      - run: pnpm build

  browser:
    needs: [backend, frontend]
    # ubuntu-latest is Ubuntu 26.04; Playwright 1.60 installs system dependencies only up to 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/cache@v4
        with:
          # setup-java caches ~/.m2/repository only; the wrapper downloads Maven itself into ~/.m2/wrapper.
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
